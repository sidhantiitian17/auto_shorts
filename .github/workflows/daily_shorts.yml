name: Autonomous 5x Daily Shorts Pipeline

on:
  schedule:
    # 5 times daily at 9:05 AM, 12:05 PM, 3:05 PM, 6:05 PM, 9:05 PM IST (UTC 3:35, 6:35, 9:35, 12:35, 15:35)
    # Using minute 35 avoids GitHub Actions peak-hour queue delays that occur at :00 and :30
    - cron: '35 3,6,9,12,15 * * *'
  workflow_dispatch: # Allows 1-click trigger from your phone via GitHub mobile app

jobs:
  clip-dub-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Deno (For YouTube EJS Challenge Solving)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify System Dependencies (FFmpeg & Node)
        run: |
          which ffmpeg || sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          which node || sudo apt-get install -y --no-install-recommends nodejs
          ffmpeg -version | head -n 1
          node -v

      - name: Install Python Libraries
        run: |
          pip install -U "yt-dlp[default]" curl-cffi requests google-api-python-client google-auth-oauthlib

      - name: Run Autonomous Shorts Engine
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python autonomous_engine.py
