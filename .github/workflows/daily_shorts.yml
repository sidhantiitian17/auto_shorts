name: Autonomous 5x Daily Shorts Pipeline

on:
  schedule:
    # 5 times daily at 9:00 AM, 12:00 PM, 3:00 PM, 6:00 PM, 9:00 PM IST (UTC 3:30, 6:30, 9:30, 12:30, 15:30)
    - cron: '30 3,6,9,12,15 * * *'
  workflow_dispatch: # Allows 1-click trigger from your phone via GitHub mobile app

jobs:
  clip-dub-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg & Node)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          pip install requests yt-dlp google-api-python-client google-auth-oauthlib

      - name: Run Autonomous Shorts Engine
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python autonomous_engine.py
